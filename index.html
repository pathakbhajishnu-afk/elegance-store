<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elegance .co | Fashion Store</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f7f7f7;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 30px;
      letter-spacing: 2px;
    }

    header p {
      margin-top: 5px;
      color: #ccc;
    }

    .hero {
      padding: 35px 20px;
      text-align: center;
      background: white;
    }

    .hero h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #666;
    }

    .product {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    .product img {
      width: 100%;
      height: 430px;
      object-fit: cover;
      background: #eee;
    }

    .product-info {
      padding: 25px;
    }

    .product-info h3 {
      font-size: 25px;
      margin-bottom: 10px;
    }

    .price {
      font-size: 25px;
      font-weight: bold;
      margin: 15px 0;
    }

    .description {
      color: #666;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .buy-button {
      display: block;
      width: 100%;
      padding: 15px;
      background: #111;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
    }

    .buy-button:hover {
      background: #333;
    }

    footer {
      margin-top: 40px;
      padding: 25px;
      text-align: center;
      background: #111;
      color: white;
    }
  </style>
</head>

<body>

  <header>
    <h1>ELEGANCE .CO</h1>
    <p>Style that speaks for you</p>
  </header>

  <section class="hero">
    <h2>New Collection</h2>
    <p>Discover our latest fashion collection.</p>
  </section>

  <div class="product">

    <img
      src="https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?auto=format&fit=crop&w=900&q=80"
      alt="Men Printed Casual Denim Shirt">

    <div class="product-info">

      <h3>Men Printed Casual Denim Shirt</h3>

      <div class="price">₹2,199</div>

      <p class="description">
        Stylish and comfortable casual denim shirt.
        Perfect for everyday wear and a modern look.
      </p>

      <a class="buy-button" href="#">
        BUY NOW
      </a>

    </div>
  </div>

  <footer>
    <p>© 2026 Elegance .co</p>
    <p>All Rights Reserved</p>
  </footer>

</body>
</html>
